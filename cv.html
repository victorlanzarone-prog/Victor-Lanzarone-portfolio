<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV | Victor Lanzarone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #cv-container {
            min-height: 100vh;
            padding: 120px 20px 50px;
            background-color: #050505;
        }

        .cv-wrapper {
            max-width: 1000px;
            margin: 0 auto;
        }

        .cv-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .cv-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-button {
            margin-bottom: 20px;
        }

        .back-button a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #888;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-button a:hover {
            color: #fff;
        }

        .cv-embed {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .cv-embed iframe {
            width: 100%;
            height: 85vh;
            border: none;
        }

        .cv-download {
            text-align: center;
            margin-top: 30px;
        }

        .cv-download a {
            display: inline-block;
            padding: 12px 40px;
            background: linear-gradient(90deg, #555, #fff);
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cv-download a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            #cv-container {
                padding: 100px 15px 30px;
            }

            .cv-header h1 {
                font-size: 1.5rem;
            }

            .cv-embed iframe {
                height: 70vh;
            }
        }
    </style>
</head>

<body>

    <nav id="navbar">
        <div class="nav-container">
            <div class="logo">PORTFOLIO<span>.</span></div>
            <ul class="nav-links">
                <li><a href="index.html#hero">Accueil</a></li>
                <li><a href="index.html#parcours">Parcours</a></li>
                <li><a href="index.html#experiences">Expériences</a></li>
                <li><a href="index.html#projets">Projets</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="cv-container">
        <div class="cv-wrapper">
            <div class="back-button">
                <a href="index.html#projets">← Retour aux projets</a>
            </div>

            <div class="cv-header">
                <h1>Mon CV</h1>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 Victor Lanzarone. Conçu avec passion.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
